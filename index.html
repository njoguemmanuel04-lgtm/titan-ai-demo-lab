<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITAN AI | Elite Deriv Trading Terminal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg: #030712;
  --panel: #0f172a;
  --border: #1e293b;
  --text: #f8fafc;
  --muted: #94a3b8;
  --green: #24e59a;
  --green-glow: rgba(36, 229, 154, 0.2);
  --red: #ff4757;
  --blue: #38bdf8;
  --yellow: #facc15;
}
body {
  background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  margin: 0;
  padding-bottom: 40px;
}
header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(to right, #fff, var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.card {
  background: linear-gradient(135deg, var(--panel), #0b0f19);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  margin-bottom: 16px;
}
.metric-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
}
.digit-box {
  width: 90px;
  height: 90px;
  margin: 14px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(36, 229, 154, 0.05);
  border: 2px solid var(--green);
  border-radius: 20px;
  font-size: 48px;
  font-weight: 900;
  color: var(--green);
  box-shadow: 0 0 25px var(--green-glow);
}
.digit-btn {
  background: #030712;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 0;
  border-radius: 8px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.digit-btn.active {
  background: rgba(36, 229, 154, 0.15);
  border-color: var(--green);
  color: var(--green);
}
input, select {
  width: 100%;
  background: #030712;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  margin-top: 4px;
  outline: none;
}
input:focus, select:focus {
  border-color: var(--green);
}
</style>
</head>
<body>

<header>
  <div class="logo">TITAN AI</div>
  <div class="inline-block mt-2 border border-emerald-500/30 bg-emerald-500/5 text-emerald-400 px-3 py-1 rounded-full text-[10px] font-bold tracking-widest" id="connectionBadge">
    ● DISCONNECTED
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 mt-5">
  <!-- CREDENTIALS CARD -->
  <div class="card">
    <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-3 font-bold">🔐 Deriv API Credentials & Market</h2>
    <div class="mb-3">
      <label class="text-[10px] uppercase tracking-wider text-slate-400">Personal Access Token (PAT)</label>
      <input id="apiToken" type="password" placeholder="Paste your token here">
    </div>
    <div class="mb-3">
      <label class="text-[10px] uppercase tracking-wider text-slate-400">Volatility Index Market</label>
      <select id="symbol">
        <option value="R_10">Volatility 10 Index</option>
        <option value="R_25">Volatility 25 Index</option>
        <option value="R_50" selected>Volatility 50 Index</option>
        <option value="R_75">Volatility 75 Index</option>
        <option value="R_100">Volatility 100 Index</option>
      </select>
    </div>
    <div class="flex gap-2 mt-3">
      <button onclick="connectDeriv()" id="connectBtn" class="w-full bg-[#24e59a] text-[#030712] font-extrabold py-3 rounded-xl text-xs tracking-wider shadow-lg shadow-emerald-500/20 hover:brightness-110 cursor-pointer">
        CONNECT TO DERIV
      </button>
      <button onclick="clearMemory()" class="bg-rose-500/10 text-rose-500 border border-rose-500/30 font-bold px-4 rounded-xl text-xs hover:bg-rose-500/20 cursor-pointer">
        CLEAR
      </button>
    </div>
  </div>

  <!-- METRICS GRID -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
    <div class="metric-card">
      <div class="text-[10px] uppercase text-slate-400">Balance</div>
      <div class="text-2xl font-black text-emerald-400 mt-1" id="balance">$0.00</div>
    </div>
    <div class="metric-card">
      <div class="text-[10px] uppercase text-slate-400">Session P/L</div>
      <div class="text-2xl font-black mt-1" id="profit">$0.00</div>
    </div>
    <div class="metric-card">
      <div class="text-[10px] uppercase text-slate-400">Contracts</div>
      <div class="text-2xl font-black mt-1" id="runs">0</div>
    </div>
    <div class="metric-card">
      <div class="text-[10px] uppercase text-slate-400">Win Rate</div>
      <div class="text-2xl font-black text-cyan-400 mt-1" id="winRate">0%</div>
    </div>
  </div>

  <!-- LIVE TICK STREAM & DIGIT GRID -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="card text-center flex flex-col justify-between">
      <div>
        <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-2 font-bold">📊 Live Tick Stream</h2>
        <div class="text-[10px] uppercase text-slate-400">Last Tick Digit</div>
        <div class="digit-box" id="lastDigit">–</div>
        <div class="text-xs text-cyan-400 mb-4" id="digitInfo">Awaiting connection...</div>
      </div>
      <div class="space-y-2">
        <button onclick="startTrading()" id="startBtn" class="w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider cursor-pointer disabled:opacity-40" disabled>
          ▶ START AUTOMATION
        </button>
        <button onclick="stopTrading()" class="w-full bg-slate-800 text-rose-400 border border-rose-500/30 font-bold py-2 rounded-xl text-xs cursor-pointer">
          ■ STOP AUTOMATION
        </button>
      </div>
    </div>

    <div class="card">
      <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-2 font-bold">⚙️ Entry Parameters</h2>
      <label class="text-[10px] uppercase tracking-wider text-slate-400">Target Barrier Digit</label>
      <div class="grid grid-cols-5 gap-2 my-2" id="digitButtons"></div>

      <div class="mt-3">
        <label class="text-[10px] uppercase tracking-wider text-slate-400">Contract Type</label>
        <select id="direction">
          <option value="DIGITOVER">DIGITOVER (Higher than digit)</option>
          <option value="DIGITUNDER">DIGITUNDER (Lower than digit)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2 mt-3">
        <div>
          <label class="text-[10px] uppercase tracking-wider text-slate-400">Base Stake ($)</label>
          <input id="stake" type="number" value="0.35" step="0.01">
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-slate-400">Martingale</label>
          <input id="martingale" type="number" value="2.1" step="0.1">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 mt-3">
        <div>
          <label class="text-[10px] uppercase tracking-wider text-emerald-400">Take Profit ($)</label>
          <input id="tp" type="number" value="10" class="border-emerald-500/50">
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-wider text-rose-400">Stop Loss ($)</label>
          <input id="sl" type="number" value="20" class="border-rose-500/50">
        </div>
      </div>
    </div>
  </div>

  <!-- SYSTEM LOG -->
  <div class="card">
    <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-2 font-bold">📜 System Execution Log</h2>
    <div id="log" class="bg-[#030712] border border-slate-800 rounded-xl p-3 h-44 overflow-y-auto font-mono text-[11px] text-slate-400 leading-relaxed">
      <div>Terminal initialized. Ready for connection.</div>
    </div>
  </div>
</main>

<script>
let ws = null;
let historyDigits = [];
let counts = Array(10).fill(0);
let state = {
  balance: 0,
  startingBalance: 0,
  total: 0,
  wins: 0,
  losses: 0,
  selectedDigit: 4,
  running: false,
  pendingBuy: false,
  awaitingResult: false,
  nextStake: 0.35,
  profit: 0,
  contractId: null
};

const $ = id => document.getElementById(id);

window.addEventListener('DOMContentLoaded', () => {
  const savedToken = localStorage.getItem('titan_deriv_token');
  if (savedToken) $("apiToken").value = savedToken;
  buildDigitButtons();
});

function log(msg) {
  const line = document.createElement("div");
  line.textContent = new Date().toLocaleTimeString() + " — " + msg;
  $("log").prepend(line);
  while ($("log").children.length > 50) $("log").lastElementChild.remove();
}

function speak(msg) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(new SpeechSynthesisUtterance(msg));
}

function buildDigitButtons() {
  const container = $("digitButtons");
  container.innerHTML = "";
  for (let d = 0; d <= 9; d++) {
    const btn = document.createElement("button");
    btn.className = "digit-btn" + (d === state.selectedDigit ? " active" : "");
    btn.textContent = d;
    btn.onclick = () => {
      state.selectedDigit = d;
      buildDigitButtons();
      log("Target barrier set to " + d);
    };
    container.appendChild(btn);
  }
}

async function connectDeriv() {
  const token = $("apiToken").value.trim();
  if (!token) {
    alert("Please paste your Deriv API Token.");
    return;
  }

  localStorage.setItem('titan_deriv_token', token);
  log("Requesting secure OTP connection via backend...");
  speak("Connecting to Deriv.");
  $("connectBtn").textContent = "CONNECTING...";

  try {
    let response = await fetch("/api/deriv-auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token })
    });

    let data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || "Authentication failed");

    log(`Authorized account: ${data.account_id} (${data.account_type})`);
    state.balance = data.balance;
    state.startingBalance = data.balance;
    state.nextStake = Number($("stake").value) || 0.35;
    
    $("balance").textContent = "$" + Number(data.balance).toFixed(2);
    $("connectionBadge").textContent = "● CONNECTED & AUTHORIZED";
    $("connectionBadge").style.color = "var(--green)";
    $("connectBtn").textContent = "CONNECTED";
    $("startBtn").disabled = false;
    speak("Authorized successfully.");

    connectWebSocket(data.ws_url);

  } catch (err) {
    log("Auth Error: " + err.message);
    alert("Connection Error: " + err.message);
    $("connectBtn").textContent = "CONNECT TO DERIV";
    speak("Connection failed.");
  }
}

function connectWebSocket(wsUrl) {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    log("Authenticated WebSocket stream opened.");
    const symbol = $("symbol").value;
    ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.msg_type === "balance" && data.balance) {
      state.balance = Number(data.balance.balance);
      $("balance").textContent = "$" + state.balance.toFixed(2);
    }

    if (data.msg_type === "tick" && data.tick) {
      const quote = data.tick.quote.toString();
      const digit = parseInt(quote.slice(-1));
      
      $("lastDigit").textContent = digit;
      $("digitInfo").textContent = `Quote: ${quote} | Symbol: ${$("symbol").value}`;

      historyDigits.push(digit);
      counts[digit]++;
      if (historyDigits.length > 100) {
        let removed = historyDigits.shift();
        counts[removed]--;
      }

      if (state.running && !state.awaitingResult && !state.pendingBuy) {
        executeTrade();
      }
    }

    if (data.msg_type === "proposal" && state.pendingBuy) {
      if (data.proposal && data.proposal.id) {
        ws.send(JSON.stringify({
          buy: data.proposal.id,
          price: data.proposal.ask_price
        }));
      }
    }

    if (data.msg_type === "buy" && data.buy) {
      state.pendingBuy = false;
      state.contractId = data.buy.contract_id;
      state.awaitingResult = true;
      log(`Contract purchased! ID: ${state.contractId}`);
      speak("Contract placed.");

      ws.send(JSON.stringify({
        proposal_open_contract: 1,
        contract_id: state.contractId,
        subscribe: 1
      }));
    }

    if (data.msg_type === "proposal_open_contract" && data.proposal_open_contract) {
      let contract = data.proposal_open_contract;
      if (contract.is_sold || contract.status === "sold") {
        let p = Number(contract.profit || 0);
        state.profit += p;
        state.total++;

        if (p > 0) {
          state.wins++;
          state.nextStake = Number($("stake").value) || 0.35;
          log(`WIN! +$${p.toFixed(2)}`);
          speak("Win.");
        } else {
          state.losses++;
          state.nextStake *= Number($("martingale").value) || 2.1;
          log(`LOSS! -$${Math.abs(p).toFixed(2)}`);
          speak("Loss.");
        }

        renderMetrics();

        let tp = Number($("tp").value);
        let sl = Number($("sl").value);

        if (state.profit >= tp) {
          state.running = false;
          log(`🎯 Take Profit reached ($${state.profit.toFixed(2)}). Stopped.`);
          speak("Take profit reached.");
        }
        if (state.profit <= -sl) {
          state.running = false;
          log(`🛑 Stop Loss hit ($${state.profit.toFixed(2)}). Stopped.`);
          speak("Stop loss hit.");
        }

        state.awaitingResult = false;
        state.contractId = null;
      }
    }
  };

  ws.onclose = () => {
    log("WebSocket connection closed.");
    $("connectionBadge").textContent = "● DISCONNECTED";
    $("connectionBadge").style.color = "var(--red)";
    $("connectBtn").textContent = "CONNECT TO DERIV";
    $("startBtn").disabled = true;
    speak("Connection closed.");
  };
}

function executeTrade() {
  const symbol = $("symbol").value;
  const contractType = $("direction").value;
  const stake = Number(state.nextStake.toFixed(2));

  state.pendingBuy = true;
  log(`Executing ${contractType} on ${symbol} with barrier ${state.selectedDigit} | Stake: $${stake}`);

  ws.send(JSON.stringify({
    proposal: 1,
    amount: stake,
    basis: "stake",
    contract_type: contractType,
    currency: "USD",
    underlying_symbol: symbol,
    duration: 1,
    duration_unit: "t",
    barrier: state.selectedDigit.toString()
  }));
}

function startTrading() {
  if (!ws) return;
  state.running = true;
  log("Automation started.");
  speak("Automation started.");
}

function stopTrading() {
  state.running = false;
  state.pendingBuy = false;
  log("Automation stopped.");
  speak("Automation stopped.");
}

function renderMetrics() {
  $("profit").textContent = (state.profit < 0 ? "-$" : "$") + Math.abs(state.profit).toFixed(2);
  $("profit").className = "text-2xl font-black mt-1 " + (state.profit >= 0 ? "text-emerald-400" : "text-rose-400");
  $("runs").textContent = state.total;
  $("winRate").textContent = state.total ? ((state.wins / state.total) * 100).toFixed(1) + "%" : "0%";
}

function clearMemory() {
  localStorage.removeItem('titan_deriv_token');
  $("apiToken").value = "";
  log("Saved credentials wiped.");
  speak("Credentials cleared.");
}
</script>
</body>
</html>
